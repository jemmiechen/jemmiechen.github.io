<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>加入會員</title>
</head>
<body bgcolor="#FFFFFF">
<h3 align="center">填寫帳號申請表
</h3>
<form action="addin.php" method="POST" onsubmit="handleNewUser(event)">
<script>
function handleNewUser(e) {
  e.preventDefault();
  var form = e.target;
  var name = form.Name.value.trim();
  var sex = form.Sex.value.trim();
  var tel = form.Telephone.value.trim();
  var email = form.Email.value.trim();
  var id = form.ID.value.trim();
  
  if (!name || !id) {
    alert("請至少填寫姓名(使用者名稱)與登入名稱！");
    return;
  }

  // 限制使用者名稱為英文，長度限 10 碼
  if (/[^\x00-\x7F]/.test(name)) {
    alert("⚠️ 使用者名稱限用純英文（不可包含中文字）！");
    form.Name.focus();
    return;
  }
  if (name.length > 10) {
    alert("⚠️ 使用者名稱長度不得超過 10 碼！");
    form.Name.focus();
    return;
  }
  
  // Save into telegram_editable_db in localStorage if present
  try {
    var raw = localStorage.getItem('telegram_editable_db');
    var db = raw ? JSON.parse(raw) : null;
    if (db && db.member_db && db.member_db.data) {
      db.member_db.data.push({
        id: id,
        username: name,
        gender: sex || "男",
        phone: tel || "未提供",
        email: email || "未提供",
        role: "一般會員",
        status: "正常"
      });
      localStorage.setItem('telegram_editable_db', JSON.stringify(db));
    }
  } catch(err) {}

  alert("恭喜！帳號 [" + id + "] (使用者名稱: " + name + ") 已成功加入會員資料庫！\n即將為您轉往資料庫選單...");
  window.location.href = "login2.html";
}
</script>
<div align="center">
<center>
<table border="0">
<tr><td align="right"><font size="2">姓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
    名</font><font size="2">：</font></td>
<td><font size="2"><input type="text" size="20" name="Name" maxlength="10" placeholder="限英文(10碼內)">
</font></td></tr>
<tr>
  <td align="right"><font size="2">性&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 
    別</font><font size="2">：</font></td>
<td><font size="2"><input type="text" size="20" name="Sex">
</font></td>
</tr>
<tr><td align="right"><font size="2">聯絡電話</font><font size="2">：</font></td>
<td><font size="2"><input type="text" size="20" name="Telephone">
</font></td></tr>
<tr><td align="right"><font size="2">E-Mail：</font></td>
<td><font size="2">
<input type="text" size="20" name="Email">
</font></td></tr><tr>
<td align="right"><font size="2">登入名稱：</font></td>
<td><font size="2"><input type="text" size="20" name="ID"></font></td>
</tr>
<tr><td align="right"><font size="2">登入密碼：</font></td>
<td><font size="2">
<input type="password" size="20" name="Password">
</font></td></tr>
</table></center></div>
<p align="center"><input type="submit" value=" 線上新增 "> </p>
</form>
