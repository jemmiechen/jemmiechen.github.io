<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件檔案上傳管理</title>
<style>
  :root {
    --bg-main: #0e1726;
    --bg-card: #1b2e4b;
    --bg-card-hover: #223a5e;
    --text-primary: #e0e6ed;
    --text-secondary: #888ea8;
    --primary: #21f2ff;
    --accent: #4361ee;
    --success: #00ab55;
    --danger: #e7515a;
    --warning: #e2a03f;
    --border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
  }

  .header-bar {
    background: linear-gradient(135deg, #1b2e4b 0%, #162438 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-title h1 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .header-title p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .nav-btn {
    background: rgba(67, 97, 238, 0.15);
    border: 1px solid rgba(67, 97, 238, 0.4);
    color: var(--primary);
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }
  .nav-btn:hover {
    background: var(--accent);
    color: #ffffff;
  }

  .main-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* 上傳拖曳區塊 */
  .upload-dropzone {
    border: 2px dashed rgba(33, 242, 255, 0.4);
    border-radius: 8px;
    padding: 30px 20px;
    text-align: center;
    background: rgba(14, 23, 38, 0.5);
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 20px;
  }
  .upload-dropzone:hover, .upload-dropzone.dragover {
    border-color: var(--primary);
    background: rgba(33, 242, 255, 0.05);
  }
  .upload-dropzone input[type="file"] {
    display: none;
  }
  .dropzone-icon {
    font-size: 38px;
    margin-bottom: 10px;
  }
  .dropzone-text {
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .dropzone-hint {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 表單選填資訊 */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: #0e1726;
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary);
  }

  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00b4d8 0%, #4361ee 100%);
    color: #ffffff;
  }
  .btn-primary:hover {
    filter: brightness(1.15);
  }
  .btn-danger {
    background: rgba(231, 81, 90, 0.2);
    border: 1px solid rgba(231, 81, 90, 0.4);
    color: #ff6b72;
  }
  .btn-danger:hover {
    background: var(--danger);
    color: #ffffff;
  }

  /* 表格區域 */
  .table-responsive {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    background: #162438;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
  }
  tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }
  .badge {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: rgba(0, 171, 85, 0.2); color: #4ade80; border: 1px solid rgba(0, 171, 85, 0.4); }
  .badge-info { background: rgba(33, 242, 255, 0.2); color: #21f2ff; border: 1px solid rgba(33, 242, 255, 0.4); }

  /* 訊息提示 */
  .toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #1b2e4b;
    border: 1px solid var(--primary);
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    font-size: 13px;
    opacity: 0;
    transform: translateY(20px);
    transition: 0.3s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <div class="header-bar">
    <div class="header-title">
      <h1>📄 文件檔案上傳管理 (Upload Documents)</h1>
      <p>支援技術手冊、期刊論文、研討簡報上傳，並即時登記至「網站資源清單」</p>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="login2.html?v=20261009v4" class="nav-btn">📊 資料庫管理選單</a>
      <a href="uploadm2.html?v=20261009v4" class="nav-btn">🖼️ 圖檔上傳</a>
    </div>
  </div>

  <!-- 上傳卡片 -->
  <div class="main-card">
    <div class="section-title">📤 選擇或拖曳文件上傳</div>

    <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="dropzone-icon">📁</div>
      <div class="dropzone-text">點擊此處瀏覽，或將文件拖曳至此處</div>
      <div class="dropzone-hint">支援格式：PDF, ZIP, RAR, PPT, DOC, TXT 等技術文件（單一檔案上限 50MB）</div>
      <input type="file" id="fileInput" multiple onchange="handleFileSelect(event)">
    </div>

    <!-- 選項設定 -->
    <div class="meta-grid">
      <div class="form-group">
        <label>資源自訂標題 (可留空自動抓取檔名)</label>
        <input type="text" id="docTitle" placeholder="例如：ATO 自動駕駛系統技術文件">
      </div>
      <div class="form-group">
        <label>資源分類</label>
        <select id="docCategory">
          <option value="手冊規範">手冊規範</option>
          <option value="研討論文">研討論文</option>
          <option value="程式原始碼">程式原始碼</option>
          <option value="簡報圖庫" selected>簡報圖庫</option>
        </select>
      </div>
      <div class="form-group">
        <label>下載權限等級</label>
        <select id="docAccess">
          <option value="公開">公開</option>
          <option value="會員專屬" selected>會員專屬</option>
          <option value="管理員">管理員</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" onclick="startUpload()">🚀 開始上傳並登錄至資料庫</button>
  </div>

  <!-- 已登錄文件清單 -->
  <div class="main-card">
    <div class="section-title">📋 系統現有文件資源清單 (已同步網站資料庫)</div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>資源編號</th>
            <th>文件標題</th>
            <th>檔名/路徑</th>
            <th>檔案大小</th>
            <th>資源分類</th>
            <th>權限等級</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="docTableBody">
          <!-- 動態載入 -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toastBox">已完成操作！</div>

<script>
let stagedFiles = [];

// 拖曳事件處理
const dropzone = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(name => {
  dropzone.addEventListener(name, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(name => {
  dropzone.addEventListener(name, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  const files = e.dataTransfer.files;
  if (files && files.length > 0) {
    stagedFiles = Array.from(files);
    updateDropzoneText();
  }
});

function handleFileSelect(e) {
  const files = e.target.files;
  if (files && files.length > 0) {
    stagedFiles = Array.from(files);
    updateDropzoneText();
  }
}

function updateDropzoneText() {
  const names = stagedFiles.map(f => f.name).join(', ');
  dropzone.querySelector('.dropzone-text').textContent = `已選取 ${stagedFiles.length} 個檔案：${names}`;
}

// 格式化大小
function formatBytes(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

// 上傳與資料庫登錄
function startUpload() {
  if (stagedFiles.length === 0) {
    showToast("⚠️ 請先選擇要上傳的文件檔案！");
    return;
  }

  const customTitle = document.getElementById('docTitle').value.trim();
  const category = document.getElementById('docCategory').value;
  const access = document.getElementById('docAccess').value;

  // 讀取既有資料庫
  let db = getStorageDB();
  if (!db.resource_db) {
    db.resource_db = { fields: [], data: [] };
  }

  stagedFiles.forEach((file, index) => {
    const nextIdNum = db.resource_db.data.length + 1 + index;
    const resId = `RES-` + String(nextIdNum).padStart(2, '0');
    const title = customTitle || file.name.replace(/\.[^/.]+$/, "");
    const sizeStr = formatBytes(file.size);

    db.resource_db.data.push({
      id: resId,
      title: title,
      filename: "file/" + file.name,
      filesize: sizeStr,
      category: category,
      access: access
    });
  });

  localStorage.setItem('telegram_editable_db', JSON.stringify(db));
  showToast(`✅ 成功上傳並登錄 ${stagedFiles.length} 筆文件至資料庫！`);

  // 清空暫存
  stagedFiles = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('docTitle').value = '';
  dropzone.querySelector('.dropzone-text').textContent = "點擊此處瀏覽，或將文件拖曳至此處";

  loadDocList();
}

// 取得資料庫
function getStorageDB() {
  const raw = localStorage.getItem('telegram_editable_db');
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return {
    resource_db: {
      data: [
        { id: "RES-03", title: "SVM 影像分類伺服端程式", filename: "file/svm4ir.zip", filesize: "350 KB", category: "程式原始碼", access: "會員專屬" },
        { id: "RES-04", title: "研究論文研討期刊 001-012", filename: "file/001-012.zip", filesize: "4.8 MB", category: "研討論文", access: "公開" },
        { id: "RES-05", title: "研究論文簡報", filename: "file/thesis.ppt", filesize: "803 KB", category: "簡報圖庫", access: "會員專屬" }
      ]
    }
  };
}

// 載入文件清單
function loadDocList() {
  const db = getStorageDB();
  const tbody = document.getElementById('docTableBody');
  tbody.innerHTML = '';

  const list = (db.resource_db && db.resource_db.data) ? db.resource_db.data : [];

  list.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${item.id}</b></td>
      <td>${item.title}</td>
      <td><code>${item.filename}</code></td>
      <td>${item.filesize}</td>
      <td><span class="badge badge-info">${item.category}</span></td>
      <td><span class="badge badge-success">${item.access}</span></td>
      <td>
        <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deleteDocItem(${idx})">🗑️ 刪除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function deleteDocItem(index) {
  if (!confirm("確定要刪除此筆文件資源記錄嗎？")) return;
  let db = getStorageDB();
  if (db.resource_db && db.resource_db.data) {
    db.resource_db.data.splice(index, 1);
    localStorage.setItem('telegram_editable_db', JSON.stringify(db));
    showToast("🗑️ 已成功刪除文件記錄！");
    loadDocList();
  }
}

function showToast(msg) {
  const t = document.getElementById('toastBox');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 初始化
window.onload = function() {
  loadDocList();
};
</script>

</body>
</html>
