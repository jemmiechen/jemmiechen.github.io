<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖檔上傳與影像資料庫登錄</title>
<style>
  :root {
    --bg-main: #0e1726;
    --bg-card: #1b2e4b;
    --bg-card-hover: #223a5e;
    --text-primary: #e0e6ed;
    --text-secondary: #888ea8;
    --primary: #21f2ff;
    --accent: #4361ee;
    --success: #00ab55;
    --danger: #e7515a;
    --warning: #e2a03f;
    --border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
  }

  .header-bar {
    background: linear-gradient(135deg, #1b2e4b 0%, #162438 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 22px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-title h1 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .header-title p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .nav-btn {
    background: rgba(67, 97, 238, 0.15);
    border: 1px solid rgba(67, 97, 238, 0.4);
    color: var(--primary);
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
  }
  .nav-btn:hover {
    background: var(--accent);
    color: #ffffff;
  }

  .main-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  /* 上傳拖曳區塊 */
  .upload-dropzone {
    border: 2px dashed rgba(33, 242, 255, 0.4);
    border-radius: 8px;
    padding: 30px 20px;
    text-align: center;
    background: rgba(14, 23, 38, 0.5);
    cursor: pointer;
    transition: 0.2s;
    margin-bottom: 20px;
  }
  .upload-dropzone:hover, .upload-dropzone.dragover {
    border-color: var(--primary);
    background: rgba(33, 242, 255, 0.05);
  }
  .upload-dropzone input[type="file"] {
    display: none;
  }
  .dropzone-icon {
    font-size: 38px;
    margin-bottom: 10px;
  }
  .dropzone-text {
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .dropzone-hint {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* 預覽網格 */
  .preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .preview-item {
    background: #0e1726;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    text-align: center;
    position: relative;
  }
  .preview-item img {
    max-width: 100%;
    height: 80px;
    object-fit: cover;
    border-radius: 4px;
  }
  .preview-item-name {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 4px;
  }

  /* 表單選填資訊 */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: #0e1726;
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--primary);
  }

  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00b4d8 0%, #4361ee 100%);
    color: #ffffff;
  }
  .btn-primary:hover {
    filter: brightness(1.15);
  }
  .btn-danger {
    background: rgba(231, 81, 90, 0.2);
    border: 1px solid rgba(231, 81, 90, 0.4);
    color: #ff6b72;
  }
  .btn-danger:hover {
    background: var(--danger);
    color: #ffffff;
  }

  /* 表格區域 */
  .table-responsive {
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    background: #162438;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
  }
  tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }
  .badge {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: rgba(0, 171, 85, 0.2); color: #4ade80; border: 1px solid rgba(0, 171, 85, 0.4); }
  .badge-warning { background: rgba(226, 160, 63, 0.2); color: #fbbf24; border: 1px solid rgba(226, 160, 63, 0.4); }
  .badge-info { background: rgba(33, 242, 255, 0.2); color: #21f2ff; border: 1px solid rgba(33, 242, 255, 0.4); }

  /* 訊息提示 */
  .toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #1b2e4b;
    border: 1px solid var(--primary);
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    font-size: 13px;
    opacity: 0;
    transform: translateY(20px);
    transition: 0.3s;
    pointer-events: none;
    z-index: 1000;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <div class="header-bar">
    <div class="header-title">
      <h1>🖼️ 圖檔上傳管理 (Upload Images)</h1>
      <p>支援辨識圖檔、監控照片批次上傳，並即時登記至「影像分類資料庫」</p>
    </div>
    <div style="display:flex; gap:10px;">
      <a href="login2.html?v=20261009v4" class="nav-btn">📊 資料庫管理選單</a>
      <a href="uploadm.html?v=20261009v4" class="nav-btn">📄 文件上傳</a>
    </div>
  </div>

  <!-- 上傳卡片 -->
  <div class="main-card">
    <div class="section-title">📤 選擇或拖曳圖檔上傳</div>

    <div class="upload-dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="dropzone-icon">📷</div>
      <div class="dropzone-text">點擊此處瀏覽照片，或將影像拖曳至此處</div>
      <div class="dropzone-hint">支援格式：JPG, JPEG, PNG, GIF, BMP（可多選批次上傳）</div>
      <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelect(event)">
    </div>

    <!-- 預覽區域 -->
    <div class="preview-grid" id="previewGrid"></div>

    <!-- 選項設定 -->
    <div class="meta-grid">
      <div class="form-group">
        <label>辨識類別</label>
        <select id="imgCategory">
          <option value="機車 (Motor)" selected>機車 (Motor)</option>
          <option value="汽車 (Car)">汽車 (Car)</option>
          <option value="火車 (Train)">火車 (Train)</option>
          <option value="路口環境">路口環境</option>
          <option value="行人 (Pedestrian)">行人 (Pedestrian)</option>
        </select>
      </div>
      <div class="form-group">
        <label>路口/拍攝地點</label>
        <input type="text" id="imgLocation" placeholder="例如：中正/七賢路口" value="中正/中華路口">
      </div>
      <div class="form-group">
        <label>預設辨識信心度</label>
        <input type="text" id="imgConfidence" value="98.0%">
      </div>
      <div class="form-group">
        <label>狀態標記</label>
        <select id="imgStatus">
          <option value="已辨識" selected>已辨識</option>
          <option value="待審核">待審核</option>
          <option value="辨識中">辨識中</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" onclick="startUpload()">🚀 開始上傳並登錄至影像資料庫</button>
  </div>

  <!-- 已登錄影像清單 -->
  <div class="main-card">
    <div class="section-title">📋 影像資料庫現有清單 (已同步網站資料庫)</div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>編號</th>
            <th>影像檔名</th>
            <th>辨識類別</th>
            <th>路口/地點</th>
            <th>信心度</th>
            <th>狀態</th>
            <th>拍攝日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="imgTableBody">
          <!-- 動態載入 -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toastBox">已完成操作！</div>

<script>
let stagedFiles = [];

// 拖曳事件處理
const dropzone = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(name => {
  dropzone.addEventListener(name, (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(name => {
  dropzone.addEventListener(name, (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  const files = e.dataTransfer.files;
  if (files && files.length > 0) {
    processImageFiles(Array.from(files));
  }
});

function handleFileSelect(e) {
  const files = e.target.files;
  if (files && files.length > 0) {
    processImageFiles(Array.from(files));
  }
}

function processImageFiles(files) {
  stagedFiles = files.filter(f => f.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|bmp)$/i.test(f.name));
  const previewGrid = document.getElementById('previewGrid');
  previewGrid.innerHTML = '';

  stagedFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const div = document.createElement('div');
      div.className = 'preview-item';
      div.innerHTML = `
        <img src="${ev.target.result}" alt="${file.name}">
        <div class="preview-item-name" title="${file.name}">${file.name}</div>
      `;
      previewGrid.appendChild(div);
    };
    reader.readAsDataURL(file);
  });

  dropzone.querySelector('.dropzone-text').textContent = `已選取 ${stagedFiles.length} 張圖片`;
}

// 上傳與資料庫登錄
function startUpload() {
  if (stagedFiles.length === 0) {
    showToast("⚠️ 請先選擇要上傳的圖檔！");
    return;
  }

  const category = document.getElementById('imgCategory').value;
  const location = document.getElementById('imgLocation').value.trim() || '市區路口';
  const confidence = document.getElementById('imgConfidence').value.trim() || '98.0%';
  const status = document.getElementById('imgStatus').value;
  const today = new Date().toISOString().split('T')[0];

  let db = getStorageDB();
  if (!db.image_db) {
    db.image_db = { fields: [], data: [] };
  }

  stagedFiles.forEach((file, index) => {
    const nextIdNum = db.image_db.data.length + 1 + index;
    const imgId = `IMG-` + String(nextIdNum).padStart(3, '0');

    db.image_db.data.push({
      id: imgId,
      filename: file.name,
      category: category,
      location: location,
      confidence: confidence,
      status: status,
      date: today
    });
  });

  localStorage.setItem('telegram_editable_db', JSON.stringify(db));
  showToast(`✅ 成功上傳並登錄 ${stagedFiles.length} 筆影像至資料庫！`);

  // 清空暫存
  stagedFiles = [];
  document.getElementById('fileInput').value = '';
  document.getElementById('previewGrid').innerHTML = '';
  dropzone.querySelector('.dropzone-text').textContent = "點擊此處瀏覽照片，或將影像拖曳至此處";

  loadImageList();
}

// 取得資料庫
function getStorageDB() {
  const raw = localStorage.getItem('telegram_editable_db');
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return {
    image_db: {
      data: [
        { id: "IMG-001", filename: "2001.JPG", category: "機車 (Motor)", location: "成功/七賢路口", confidence: "98.5%", status: "已辨識", date: "2026-10-01" },
        { id: "IMG-002", filename: "2002.JPG", category: "機車 (Motor)", location: "成功/七賢路口", confidence: "97.2%", status: "已辨識", date: "2026-10-01" },
        { id: "IMG-003", filename: "2003.JPG", category: "機車 (Motor)", location: "中正/中華路口", confidence: "96.8%", status: "已辨識", date: "2026-10-02" },
        { id: "IMG-004", filename: "2004.JPG", category: "機車 (Motor)", location: "中正/中華路口", confidence: "99.1%", status: "已辨識", date: "2026-10-02" },
        { id: "IMG-005", filename: "1616205.jpg", category: "火車 (Train)", location: "LZB700M 測試軌", confidence: "99.4%", status: "已辨識", date: "2026-10-05" },
        { id: "IMG-006", filename: "8690-JQ.JPG", category: "汽車 (Car)", location: "高雄中山路", confidence: "95.0%", status: "已辨識", date: "2026-10-06" }
      ]
    }
  };
}

// 載入影像清單
function loadImageList() {
  const db = getStorageDB();
  const tbody = document.getElementById('imgTableBody');
  tbody.innerHTML = '';

  const list = (db.image_db && db.image_db.data) ? db.image_db.data : [];

  list.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${item.id}</b></td>
      <td><code>${item.filename}</code></td>
      <td><span class="badge badge-info">${item.category}</span></td>
      <td>${item.location}</td>
      <td>${item.confidence}</td>
      <td><span class="badge badge-success">${item.status}</span></td>
      <td>${item.date}</td>
      <td>
        <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;" onclick="deleteImageItem(${idx})">🗑️ 刪除</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function deleteImageItem(index) {
  if (!confirm("確定要刪除此筆影像記錄嗎？")) return;
  let db = getStorageDB();
  if (db.image_db && db.image_db.data) {
    db.image_db.data.splice(index, 1);
    localStorage.setItem('telegram_editable_db', JSON.stringify(db));
    showToast("🗑️ 已成功刪除影像記錄！");
    loadImageList();
  }
}

function showToast(msg) {
  const t = document.getElementById('toastBox');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 初始化
window.onload = function() {
  loadImageList();
};
</script>

</body>
</html>
