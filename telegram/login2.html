<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料庫管理選單 - 可編輯資料庫表格</title>
<style>
  :root {
    --bg-main: #0e1726;
    --bg-card: #1b2e4b;
    --bg-card-hover: #223a5e;
    --text-primary: #e0e6ed;
    --text-secondary: #888ea8;
    --primary: #21f2ff;
    --primary-dark: #00b4d8;
    --accent: #4361ee;
    --success: #00ab55;
    --danger: #e7515a;
    --warning: #e2a03f;
    --border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
  }

  /* 頂部標頭 */
  .header-bar {
    background: linear-gradient(135deg, #1b2e4b 0%, #162438 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-title h1 {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.5px;
  }
  .badge-auth {
    background: rgba(0, 171, 85, 0.2);
    color: #4ade80;
    border: 1px solid rgba(0, 171, 85, 0.4);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .badge-auth::before {
    content: "";
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    display: inline-block;
  }

  /* 資料庫選單分頁切換 */
  .db-nav {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .db-tab-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .db-tab-btn:hover {
    background: rgba(33, 242, 255, 0.1);
    color: var(--primary);
    border-color: rgba(33, 242, 255, 0.4);
  }
  .db-tab-btn.active {
    background: linear-gradient(135deg, rgba(33, 242, 255, 0.25) 0%, rgba(67, 97, 238, 0.35) 100%);
    color: #ffffff;
    border-color: var(--primary);
    box-shadow: 0 2px 10px rgba(33, 242, 255, 0.2);
  }

  /* 操作工具列 */
  .toolbar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-input {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border);
    color: #ffffff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus {
    border-color: var(--primary);
  }

  /* 按鈕樣式 */
  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    user-select: none;
  }
  .btn:active {
    transform: scale(0.97);
  }
  .btn-primary {
    background: var(--primary);
    color: #0b1329;
  }
  .btn-primary:hover {
    background: #00d2e0;
    transform: translateY(-1px);
  }
  .btn-success {
    background: var(--success);
    color: #ffffff;
  }
  .btn-success:hover { background: #00964b; }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.15);
  }
  .btn-danger {
    background: rgba(231, 81, 90, 0.2);
    color: #ff6b72;
    border: 1px solid rgba(231, 81, 90, 0.4);
  }
  .btn-danger:hover {
    background: var(--danger);
    color: #ffffff;
  }
  .btn-sm {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
  }

  /* 表格區域 */
  .table-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    overflow-x: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  table.data-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 13px;
  }
  table.data-table th {
    background: rgba(0, 0, 0, 0.3);
    color: #ffffff;
    font-weight: 700;
    padding: 12px 14px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    user-select: none;
  }
  table.data-table td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    vertical-align: middle;
  }
  table.data-table tbody tr {
    transition: background-color 0.15s;
  }
  table.data-table tbody tr:hover {
    background-color: var(--bg-card-hover);
  }

  /* 單元格可編輯效果 */
  .editable-cell {
    cursor: pointer;
    border-radius: 4px;
    padding: 3px 6px;
    transition: all 0.2s;
    display: inline-block;
  }
  .editable-cell:hover {
    background: rgba(33, 242, 255, 0.15);
    outline: 1px dashed var(--primary);
  }
  .cell-input {
    background: #0d1a2d;
    color: #ffffff;
    border: 1px solid var(--primary);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    width: 100%;
    outline: none;
  }

  /* 狀態標籤 */
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-success { background: rgba(0, 171, 85, 0.2); color: #4ade80; border: 1px solid rgba(0, 171, 85, 0.4); }
  .badge-warning { background: rgba(226, 160, 63, 0.2); color: #fbbf24; border: 1px solid rgba(226, 160, 63, 0.4); }
  .badge-info { background: rgba(33, 242, 255, 0.2); color: #21f2ff; border: 1px solid rgba(33, 242, 255, 0.4); }
  .badge-danger { background: rgba(231, 81, 90, 0.2); color: #f87171; border: 1px solid rgba(231, 81, 90, 0.4); }

  /* 狀態列通知 Toast */
  .status-toast {
    position: fixed;
    top: 24px;
    right: 24px;
    background: #00ab55;
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 6px 25px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(-20px);
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 10000;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .status-toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .status-toast.warning { background: #e2a03f; }

  /* 彈出視窗 (Modal) */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .modal-overlay.active {
    display: flex !important;
  }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .modal-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.25);
  }
  .modal-header h3 { font-size: 16px; color: #ffffff; }
  .modal-close {
    background: none; border: none; color: var(--text-secondary);
    font-size: 22px; cursor: pointer; padding: 0 6px;
  }
  .modal-close:hover { color: #ffffff; }
  .modal-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .form-control {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .form-control:focus { border-color: var(--primary); }
  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: rgba(0, 0, 0, 0.15);
  }
  .footer-hint {
    margin-top: 15px;
    font-size: 12px;
    color: var(--text-secondary);
    text-align: right;
  }
</style>
</head>
<body>

  <!-- 頂部標頭 -->
  <div class="header-bar">
    <div class="header-title">
      <h1>資料庫管理中心 - 可編輯表格選單</h1>
      <span class="badge-auth">管理員認證通過 (已核准)</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="left.htm" target="leftFrame" class="btn btn-secondary btn-sm">⬅️ 返回選單</a>
      <a href="software.htm" target="_self" class="btn btn-secondary btn-sm">💾 資源下載</a>
    </div>
  </div>

  <!-- 資料庫類別切換選單 (Tabs) -->
  <div class="db-nav">
    <button class="db-tab-btn active" data-tab="image_db" onclick="switchTable('image_db', this)">
      🖼️ 影像分類資料庫 (Image DB)
    </button>
    <button class="db-tab-btn" data-tab="traffic_db" onclick="switchTable('traffic_db', this)">
      🚦 路口機車監控資料庫 (Traffic DB)
    </button>
    <button class="db-tab-btn" data-tab="member_db" onclick="switchTable('member_db', this)">
      👥 會員帳號資料庫 (Member DB)
    </button>
    <button class="db-tab-btn" data-tab="resource_db" onclick="switchTable('resource_db', this)">
      📁 網站資源下載清單 (Resource DB)
    </button>
  </div>

  <!-- 工具列 -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn btn-primary" id="btnAddRow" onclick="openAddModal()">➕ 新增一筆記錄</button>
      <button class="btn btn-success" id="btnSaveAll" onclick="saveToStorage(true)">💾 儲存所有修改</button>
      <button class="btn btn-secondary" onclick="exportCSV()">📥 匯出 CSV</button>
      <button class="btn btn-secondary" onclick="exportJSON()">📄 匯出 JSON</button>
      <button class="btn btn-danger btn-sm" onclick="resetDefaultData()">↩️ 重置預設資料</button>
    </div>
    <div class="toolbar-right">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 快速搜尋表格內容..." oninput="filterTable()">
    </div>
  </div>

  <!-- 可編輯表格區域 -->
  <div class="table-container">
    <table class="data-table" id="mainDataTable">
      <thead>
        <tr id="tableHeadRow"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="footer-hint">💡 提示：點擊任何文字單元格可「直接線上編輯」，按下 Enter 即可保存；或點擊操作欄的「✏️ 編輯」鍵。</div>

  <!-- 新增/修改彈跳對話框 (Modal) -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">新增資料記錄</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalFormContainer"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="submitModalData()">確定儲存</button>
      </div>
    </div>
  </div>

  <!-- 提示訊息 Toast -->
  <div class="status-toast" id="toastMessage">已成功儲存！</div>

<script>
// ==========================================
// 預設資料庫結構與初始資料
// ==========================================
const DEFAULT_DATABASES = {

      { id: "IMG-005", filename: "1616205.jpg", category: "火車 (Train)", location: "LZB700M 測試軌", confidence: "99.4%", status: "已辨識", date: "2026-10-05" },
      { id: "IMG-006", filename: "8690-JQ.JPG", category: "汽車 (Car)", location: "高雄中山路", confidence: "95.0%", status: "已辨識", date: "2026-10-06" }

let currentTab = 'image_db';
let database = {};
let editingRowIndex = null;

// ==========================================
// 錯誤捕捉與安全校驗
// ==========================================
window.onerror = function(msg, url, line) {
  console.error("腳本執行錯誤:", msg, "行號:", line);
  showToast("⚠️ 提示: " + msg, "warning");
};

function ensureDatabaseIntegrity() {
  if (!database || typeof database !== 'object') {
    database = JSON.parse(JSON.stringify(DEFAULT_DATABASES));
    return;
  }
  for (let key in DEFAULT_DATABASES) {
    if (!database[key] || !Array.isArray(database[key].fields) || !Array.isArray(database[key].data)) {
      database[key] = JSON.parse(JSON.stringify(DEFAULT_DATABASES[key]));
    }
  }
}

// ==========================================
// 初始化與資料載入
// ==========================================
function initApp() {
  const localData = localStorage.getItem('telegram_editable_db');
  if (localData) {
    try {
      database = JSON.parse(localData);
      ensureDatabaseIntegrity();
    } catch(e) {
      database = JSON.parse(JSON.stringify(DEFAULT_DATABASES));
    }
  } else {
    database = JSON.parse(JSON.stringify(DEFAULT_DATABASES));
  }
  renderTable();
}

function switchTable(tabKey, btnEl) {
  currentTab = tabKey;
  ensureDatabaseIntegrity();

  document.querySelectorAll('.db-tab-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.getAttribute('data-tab') === tabKey) {
      btn.classList.add('active');
    }
  });

  if (btnEl && btnEl.classList) {
    btnEl.classList.add('active');
  }

  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';

  renderTable();
  const dbName = database[currentTab] ? database[currentTab].name : tabKey;
  showToast(`已切換至【${dbName}】`);
}

// ==========================================
// 表格渲染
// ==========================================
function renderTable() {
  ensureDatabaseIntegrity();
  const db = database[currentTab];
  if (!db) return;

  const theadRow = document.getElementById('tableHeadRow');
  if (theadRow) {
    theadRow.innerHTML = '';
    db.fields.forEach(f => {
      const th = document.createElement('th');
      th.textContent = f.label;
      theadRow.appendChild(th);
    });
    const thAction = document.createElement('th');
    thAction.textContent = "操作管理";
    thAction.style.textAlign = "center";
    theadRow.appendChild(thAction);
  }

  filterTable();
}

function filterTable() {
  ensureDatabaseIntegrity();
  const db = database[currentTab];
  if (!db) return;

  const searchEl = document.getElementById('searchInput');
  const query = searchEl ? searchEl.value.trim().toLowerCase() : '';
  const tbody = document.getElementById('tableBody');
  if (!tbody) return;
  tbody.innerHTML = '';

  db.data.forEach((row, rowIndex) => {
    if (query) {
      const match = Object.values(row).some(val => String(val).toLowerCase().includes(query));
      if (!match) return;
    }

    const tr = document.createElement('tr');

    db.fields.forEach(f => {
      const td = document.createElement('td');
      const val = row[f.key] !== undefined ? row[f.key] : '';

      if (f.type === 'badge') {
        const badgeSpan = document.createElement('span');
        badgeSpan.className = getBadgeClass(val);
        badgeSpan.textContent = val;
        badgeSpan.classList.add('editable-cell');
        badgeSpan.title = "點擊快速切換狀態";
        badgeSpan.onclick = function() { toggleBadgeStatus(rowIndex, f); };
        td.appendChild(badgeSpan);
      } else {
        const span = document.createElement('span');
        span.className = f.editable ? 'editable-cell' : '';
        span.textContent = val;
        if (f.editable) {
          span.title = "點擊直接編輯";
          span.onclick = function() { makeInlineEditable(td, span, rowIndex, f.key); };
        }
        td.appendChild(span);
      }
      tr.appendChild(td);
    });

    const tdAction = document.createElement('td');
    tdAction.style.textAlign = "center";
    tdAction.innerHTML = `
      <button class="btn btn-secondary btn-sm" onclick="openEditModal(${rowIndex})" title="編輯此筆">✏️ 編輯</button>
      <button class="btn btn-secondary btn-sm" onclick="duplicateRow(${rowIndex})" title="複製此筆">📋 複製</button>
      <button class="btn btn-danger btn-sm" onclick="deleteRow(${rowIndex})" title="刪除此筆">🗑️ 刪除</button>
    `;
    tr.appendChild(tdAction);

    tbody.appendChild(tr);
  });
}

function getBadgeClass(text) {
  if (['已辨識', '正常', '公開'].includes(text)) return 'badge badge-success';
  if (['待審核', '待開通', '超速', '未戴安全帽', '紅燈越線'].includes(text)) return 'badge badge-warning';
  if (['辨識中', '研究員', '會員專屬'].includes(text)) return 'badge badge-info';
  if (['異常', '暫停', '管理員'].includes(text)) return 'badge badge-danger';
  return 'badge badge-info';
}

function toggleBadgeStatus(rowIndex, field) {
  if (!field.options || field.options.length === 0) return;
  const currentVal = database[currentTab].data[rowIndex][field.key];
  const idx = field.options.indexOf(currentVal);
  const nextIdx = (idx + 1) % field.options.length;
  database[currentTab].data[rowIndex][field.key] = field.options[nextIdx];
  saveToStorage();
  filterTable();
  showToast(`已將狀態變更為【${field.options[nextIdx]}】`);
}

// ==========================================
// 單元格行內編輯 (Inline Cell Editing)
// ==========================================
function makeInlineEditable(td, span, rowIndex, fieldKey) {
  const currentVal = span.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input';
  input.value = currentVal;

  td.innerHTML = '';
  td.appendChild(input);
  input.focus();

  let isSaved = false;
  function saveValue() {
    if (isSaved) return;
    isSaved = true;
    const newVal = input.value.trim();
    database[currentTab].data[rowIndex][fieldKey] = newVal;
    saveToStorage();
    filterTable();
    showToast("單元格內容已更新儲存！");
  }

  input.onblur = saveValue;
  input.onkeydown = function(e) {
    if (e.key === 'Enter') saveValue();
    if (e.key === 'Escape') { isSaved = true; filterTable(); }
  };
}

// ==========================================
// 彈出對話框 (Modal 新增/編輯)
// ==========================================
function openAddModal() {
  editingRowIndex = null;
  ensureDatabaseIntegrity();
  document.getElementById('modalTitle').textContent = `➕ 新增記錄至 [${database[currentTab].name}]`;
  const container = document.getElementById('modalFormContainer');
  container.innerHTML = '';

  const fields = database[currentTab].fields;
  fields.forEach(f => {
    const div = document.createElement('div');
    div.className = 'form-group';
    let inputHtml = '';
    if (f.key === 'id') {
      const nextId = "NEW-" + Math.floor(100 + Math.random() * 900);
      inputHtml = `<input type="text" id="modal_${f.key}" class="form-control" value="${nextId}">`;
    } else if (f.options) {
      const opts = f.options.map(o => `<option value="${o}">${o}</option>`).join('');
      inputHtml = `<select id="modal_${f.key}" class="form-control">${opts}</select>`;
    } else {
      inputHtml = `<input type="${f.type === 'number' ? 'number' : 'text'}" id="modal_${f.key}" class="form-control" placeholder="請輸入${f.label}">`;
    }
    div.innerHTML = `<label>${f.label}</label>${inputHtml}`;
    container.appendChild(div);
  });

  const modal = document.getElementById('editModal');
  modal.classList.add('active');
}

function openEditModal(rowIndex) {
  editingRowIndex = rowIndex;
  ensureDatabaseIntegrity();
  const rowData = database[currentTab].data[rowIndex];
  document.getElementById('modalTitle').textContent = `✏️ 編輯記錄 (${rowData.id || ''})`;
  const container = document.getElementById('modalFormContainer');
  container.innerHTML = '';

  const fields = database[currentTab].fields;
  fields.forEach(f => {
    const div = document.createElement('div');
    div.className = 'form-group';
    const val = rowData[f.key] !== undefined ? rowData[f.key] : '';
    let inputHtml = '';
    if (f.options) {
      const opts = f.options.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('');
      inputHtml = `<select id="modal_${f.key}" class="form-control">${opts}</select>`;
    } else {
      inputHtml = `<input type="text" id="modal_${f.key}" class="form-control" value="${val}" ${f.editable ? '' : 'readonly style="opacity:0.6"'}>`;
    }
    div.innerHTML = `<label>${f.label}</label>${inputHtml}`;
    container.appendChild(div);
  });

  const modal = document.getElementById('editModal');
  modal.classList.add('active');
}

function closeModal() {
  const modal = document.getElementById('editModal');
  if (modal) modal.classList.remove('active');
}

function submitModalData() {
  const fields = database[currentTab].fields;
  const rowObj = {};
  fields.forEach(f => {
    const el = document.getElementById(`modal_${f.key}`);
    if (el) rowObj[f.key] = el.value.trim();
  });

  if (editingRowIndex !== null) {
    database[currentTab].data[editingRowIndex] = rowObj;
    showToast("記錄已修改完成！");
  } else {
    database[currentTab].data.push(rowObj);
    showToast("新記錄已成功新增！");
  }

  closeModal();
  saveToStorage();
  filterTable();
}

function duplicateRow(rowIndex) {
  const rowData = JSON.parse(JSON.stringify(database[currentTab].data[rowIndex]));
  rowData.id = rowData.id + "-COPY";
  database[currentTab].data.splice(rowIndex + 1, 0, rowData);
  saveToStorage();
  filterTable();
  showToast("已成功複製該列資料！");
}

function deleteRow(rowIndex) {
  const rowData = database[currentTab].data[rowIndex];
  if (confirm(`確定要刪除此筆記錄 (${rowData.id || ''}) 嗎？`)) {
    database[currentTab].data.splice(rowIndex, 1);
    saveToStorage();
    filterTable();
    showToast("記錄已刪除！");
  }
}

// ==========================================
// 儲存與快取機制 (LocalStorage)
// ==========================================
function saveToStorage(notify = false) {
  const jsonStr = JSON.stringify(database);
  localStorage.setItem('telegram_editable_db', jsonStr);

  if (notify) {
    showToast("💾 已成功儲存所有變更至資料庫！");
  }
}

function resetDefaultData() {
  if (confirm("確定要將所有資料庫恢復為系統初始預設值嗎？此動作將清除已編輯的變更。")) {
    database = JSON.parse(JSON.stringify(DEFAULT_DATABASES));
    saveToStorage();
    filterTable();
    showToast("已成功重置為初始預設資料！");
  }
}

// ==========================================
// 匯出 CSV 與 JSON
// ==========================================
function exportCSV() {
  const db = database[currentTab];
  let csvContent = "\uFEFF"; // UTF-8 BOM
  csvContent += db.fields.map(f => `"${f.label}"`).join(",") + "\r\n";
  db.data.forEach(row => {
    csvContent += db.fields.map(f => `"${row[f.key] || ''}"`).join(",") + "\r\n";
  });
  downloadFile(`${currentTab}_export.csv`, csvContent, 'text/csv;charset=utf-8;');
  showToast("CSV 匯出成功！");
}

function exportJSON() {
  const db = database[currentTab];
  const jsonContent = JSON.stringify(db.data, null, 2);
  downloadFile(`${currentTab}_export.json`, jsonContent, 'application/json');
  showToast("JSON 匯出成功！");
}

function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function showToast(msg, type = "success") {
  const toast = document.getElementById('toastMessage');
  if (!toast) return;
  toast.textContent = (type === "warning" ? "" : "✅ ") + msg;
  toast.className = "status-toast " + (type === "warning" ? "warning" : "");
  toast.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// 啟動應用程式
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
